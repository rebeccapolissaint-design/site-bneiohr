<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oracle des Lwa | Bnei Ohr</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600;700&family=Noto+Serif+Hebrew:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #d4af37;
    --gold-dim: rgba(212,175,55,0.4);
    --gold-glow: rgba(212,175,55,0.12);
    --purple: #9b7fd4;
    --purple-dim: rgba(155,127,212,0.35);
    --purple-glow: rgba(155,127,212,0.1);
    --dark: #04030a;
    --text: #e8e0d0;
    --text-dim: rgba(232,224,208,0.45);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--dark);
    font-family: 'Cormorant Garamond', serif;
    overflow: hidden;
  }

  /* ── CANVAS ÉTOILÉ ── */
  #canvas {
    position: fixed; inset: 0; z-index: 0;
  }

  /* ── CERCLES MYSTIQUES ── */
  .rings {
    position: fixed; inset: 0; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .ring {
    position: absolute; border-radius: 50%; border: 1px solid;
    animation: ring-spin linear infinite;
  }
  .ring:nth-child(1) {
    width: 520px; height: 520px;
    border-color: rgba(212,175,55,0.06);
    animation-duration: 60s;
  }
  .ring:nth-child(2) {
    width: 380px; height: 380px;
    border-color: rgba(155,127,212,0.08);
    animation-duration: 45s; animation-direction: reverse;
  }
  .ring:nth-child(3) {
    width: 260px; height: 260px;
    border-color: rgba(212,175,55,0.05);
    animation-duration: 30s;
  }
  @keyframes ring-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* Marqueurs sur les anneaux */
  .ring::before, .ring::after {
    content: '✦';
    position: absolute; top: -6px; left: 50%;
    transform: translateX(-50%);
    font-size: 10px; color: var(--gold-dim);
  }
  .ring::after { top: auto; bottom: -6px; }

  /* ── LUEUR CENTRALE ── */
  .glow-center {
    position: fixed; inset: 0; z-index: 1;
    background: radial-gradient(
      ellipse 40% 40% at 50% 50%,
      rgba(155,127,212,0.07) 0%,
      rgba(212,175,55,0.04) 40%,
      transparent 70%
    );
    pointer-events: none;
  }

  /* ── CONTENEUR PRINCIPAL ── */
  .screen {
    position: relative; z-index: 10;
    width: 100%; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 2rem;
  }

  /* ── SYMBOLE CENTRAL ── */
  .oracle-symbol {
    font-size: 3.2rem;
    margin-bottom: 1.6rem;
    display: block;
    animation: symbol-pulse 3s ease-in-out infinite;
    filter: drop-shadow(0 0 16px rgba(155,127,212,0.5));
    cursor: default;
    user-select: none;
  }
  @keyframes symbol-pulse {
    0%, 100% { filter: drop-shadow(0 0 14px rgba(155,127,212,0.4)); transform: scale(1); }
    50%       { filter: drop-shadow(0 0 28px rgba(155,127,212,0.75)); transform: scale(1.04); }
  }

  /* ── TITRES ── */
  .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 0.5rem;
    letter-spacing: 0.55em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 0.7rem;
    animation: fade-down 1s ease both;
  }

  .main-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    font-weight: 600;
    letter-spacing: 0.22em;
    color: var(--gold);
    text-transform: uppercase;
    text-align: center;
    text-shadow: 0 0 30px rgba(212,175,55,0.25);
    margin-bottom: 0.5rem;
    animation: fade-down 1s 0.1s ease both;
  }

  .hebrew-title {
    font-family: 'Noto Serif Hebrew', serif;
    font-size: 1.1rem;
    color: rgba(212,175,55,0.35);
    display: block;
    text-align: center;
    margin-bottom: 2.2rem;
    letter-spacing: 0.1em;
    animation: fade-down 1s 0.2s ease both;
  }

  /* ── LIGNE DÉCORATIVE ── */
  .deco-line {
    display: flex; align-items: center; gap: 0.8rem;
    margin-bottom: 2.2rem;
    animation: fade-down 1s 0.3s ease both;
  }
  .deco-line::before, .deco-line::after {
    content: '';
    width: 60px; height: 1px;
    background: linear-gradient(to right, transparent, rgba(212,175,55,0.3));
  }
  .deco-line::after {
    background: linear-gradient(to left, transparent, rgba(212,175,55,0.3));
  }
  .deco-line span {
    font-size: 0.65rem;
    color: var(--gold-dim);
  }

  /* ── ZONE DE SAISIE ── */
  .input-zone {
    display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
    animation: fade-up 1s 0.4s ease both;
    width: 100%; max-width: 280px;
  }

  .input-label {
    font-family: 'Cinzel', serif;
    font-size: 0.44rem;
    letter-spacing: 0.35em;
    color: rgba(212,175,55,0.35);
    text-transform: uppercase;
    align-self: flex-start;
  }

  .code-field {
    width: 100%;
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(155,127,212,0.25);
    border-radius: 1px;
    color: var(--text);
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    letter-spacing: 0.45em;
    text-align: center;
    padding: 0.85rem 1.2rem;
    outline: none;
    transition: border-color 0.35s, box-shadow 0.35s;
    caret-color: var(--gold);
  }
  .code-field::placeholder {
    color: rgba(255,255,255,0.12);
    letter-spacing: 0.3em;
    font-size: 0.9rem;
  }
  .code-field:focus {
    border-color: rgba(155,127,212,0.55);
    box-shadow: 0 0 22px rgba(155,127,212,0.1), inset 0 0 10px rgba(155,127,212,0.03);
  }

  /* ── BOUTON ── */
  .enter-btn {
    width: 100%;
    margin-top: 0.4rem;
    padding: 0.9rem 1.5rem;
    background: linear-gradient(135deg,
      rgba(155,127,212,0.12) 0%,
      rgba(212,175,55,0.07) 100%
    );
    border: 1px solid rgba(155,127,212,0.35);
    color: #c4b0e8;
    font-family: 'Cinzel', serif;
    font-size: 0.55rem;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.35s;
    position: relative;
    overflow: hidden;
  }
  .enter-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(155,127,212,0.18), rgba(212,175,55,0.08));
    opacity: 0; transition: opacity 0.35s;
  }
  .enter-btn:hover::before { opacity: 1; }
  .enter-btn:hover {
    border-color: rgba(155,127,212,0.6);
    color: #d4c4f0;
    box-shadow: 0 0 20px rgba(155,127,212,0.12);
  }
  .enter-btn:active { transform: scale(0.99); }

  /* ── MESSAGE D'ERREUR ── */
  .error-msg {
    font-family: 'Cinzel', serif;
    font-size: 0.48rem;
    letter-spacing: 0.2em;
    color: #e05555;
    text-transform: uppercase;
    text-align: center;
    height: 1rem;
    opacity: 0;
    transition: opacity 0.3s;
    margin-top: 0.2rem;
  }
  .error-msg.visible { opacity: 1; }

  /* ── SHAKE ── */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60%  { transform: translateX(-7px); }
    40%, 80%  { transform: translateX(7px); }
  }
  .shake { animation: shake 0.4s ease; }

  /* ── NOTE ── */
  .access-note {
    margin-top: 2rem;
    font-style: italic;
    font-size: 0.88rem;
    color: rgba(255,255,255,0.18);
    text-align: center;
    max-width: 300px;
    line-height: 1.9;
    animation: fade-up 1s 0.6s ease both;
  }

  /* ── SUCCÈS: flash doré ── */
  .success-flash {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(ellipse at 50% 50%,
      rgba(212,175,55,0.25) 0%, transparent 70%);
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s;
  }
  .success-flash.active { opacity: 1; }

  /* ── ANIMATIONS GLOBALES ── */
  @keyframes fade-down {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── NAV MINIMALISTE ── */
  .mini-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.1rem 2rem;
    border-bottom: 1px solid rgba(212,175,55,0.07);
  }
  .mini-nav-logo {
    display: flex; align-items: center; gap: 0.6rem;
    text-decoration: none;
  }
  .mini-nav-hebrew {
    font-family: 'Noto Serif Hebrew', serif;
    font-size: 1.1rem; color: var(--gold);
  }
  .mini-nav-name {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem; letter-spacing: 0.2em;
    color: var(--gold); text-transform: uppercase;
  }
  .mini-nav-back {
    font-family: 'Cinzel', serif;
    font-size: 0.5rem; letter-spacing: 0.18em;
    color: rgba(212,175,55,0.4); text-decoration: none;
    text-transform: uppercase; transition: color 0.3s;
  }
  .mini-nav-back:hover { color: var(--gold); }

  /* Mobile */
  @media (max-width: 480px) {
    .ring:nth-child(1) { width: 340px; height: 340px; }
    .ring:nth-child(2) { width: 250px; height: 250px; }
    .ring:nth-child(3) { width: 170px; height: 170px; }
  }
</style>
</head>
<body>

<!-- Canvas étoilé -->
<canvas id="canvas"></canvas>

<!-- Anneaux mystiques -->
<div class="rings">
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>
</div>

<!-- Lueur -->
<div class="glow-center"></div>

<!-- Flash succès -->
<div class="success-flash" id="successFlash"></div>

<!-- Nav -->
<nav class="mini-nav">
  <a href="index.html" class="mini-nav-logo">
    <span class="mini-nav-hebrew">בְּנֵי אוֹר</span>
    <span class="mini-nav-name">Bnei Ohr</span>
  </a>
  <a href="lwa.html" class="mini-nav-back">← Les Lwa</a>
</nav>

<!-- Écran principal -->
<div class="screen">

  <span class="oracle-symbol">🔮</span>

  <div class="eyebrow">Portail Sacré</div>
  <h1 class="main-title">Oracle des Lwa</h1>
  <span class="hebrew-title">אוֹרָקֶל הַלְּוָואוֹת</span>

  <div class="deco-line"><span>✦</span></div>

  <div class="input-zone">
    <span class="input-label">Code d'initié</span>
    <input
      type="password"
      class="code-field"
      id="codeInput"
      placeholder="· · · · · ·"
      maxlength="16"
      autocomplete="off"
      spellcheck="false"
    />
    <button class="enter-btn" id="enterBtn" onclick="checkCode()">
      Entrer dans l'Oracle
    </button>
    <div class="error-msg" id="errorMsg">Code incorrect — Essayez encore</div>
  </div>

  <p class="access-note">
    Ce portail est réservé aux membres initiés de Bnei Ohr.<br>
    Votre code vous a été transmis lors de votre initiation.
  </p>

</div>

<script>
// ══ ÉTOILES ══
(function () {
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var stars = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function initStars() {
    stars = [];
    for (var i = 0; i < 140; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.2 + 0.2,
        o: Math.random() * 0.5 + 0.05,
        speed: Math.random() * 0.4 + 0.1,
        phase: Math.random() * Math.PI * 2,
        color: Math.random() > 0.85 ? '#c4b0e8' : '#d4af37'
      });
    }
  }

  var frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    frame += 0.008;
    stars.forEach(function (s) {
      var opacity = s.o * (0.5 + 0.5 * Math.sin(frame * s.speed + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = s.color.replace(')', ',' + opacity + ')').replace('rgb', 'rgba').replace('#d4af37', 'rgba(212,175,55,' + opacity + ')').replace('#c4b0e8', 'rgba(196,176,232,' + opacity + ')');
      // simple fallback
      ctx.globalAlpha = opacity;
      ctx.fillStyle = s.color;
      ctx.fill();
      ctx.globalAlpha = 1;
    });
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', function () { resize(); initStars(); });
  resize(); initStars(); draw();
})();

// ══ CODES D'ACCÈS ══
// Modifiez ce tableau pour changer les codes
var VALID_CODES = [
  'BNEI2024',
  'LWA777',
  'OHRINITIEE',
  'LEGBAKEY',
  'CHESED18'
];

var SESSION_KEY = 'bneiohr_oracle_access';

// Enter key
document.getElementById('codeInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') checkCode();
});

// Vérification
function checkCode() {
  var val = document.getElementById('codeInput').value.trim().toUpperCase();
  var ok = VALID_CODES.indexOf(val) !== -1;

  if (ok) {
    // Flash doré
    var flash = document.getElementById('successFlash');
    flash.classList.add('active');

    // Session
    sessionStorage.setItem(SESSION_KEY, '1');

    // Redirection après animation
    setTimeout(function () {
      window.location.href = 'oracle-lwa-inner.html';
    }, 600);
  } else {
    // Shake + message
    var field = document.getElementById('codeInput');
    field.classList.remove('shake');
    void field.offsetWidth;
    field.classList.add('shake');
    field.value = '';

    var err = document.getElementById('errorMsg');
    err.classList.add('visible');
    setTimeout(function () { err.classList.remove('visible'); }, 3000);
    field.focus();
  }
}

// Si déjà authentifié dans la session
if (sessionStorage.getItem(SESSION_KEY) === '1') {
  window.location.href = 'oracle-lwa-inner.html';
}
</script>

<script id="oracleAutoAccess">
sessionStorage.setItem('bneiohr_oracle_access','1');
</script>
</body>
<script src="/global-player.js"></script>
</html>
