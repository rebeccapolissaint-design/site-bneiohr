<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bnei Ohr - Modil 1 Leson 1</title>
    <style>
        body { background: #050505; color: #f0f0f0; font-family: 'Cormorant Garamond', serif; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .question-box { background: rgba(20, 15, 30, 0.7); border: 1px solid #3a2a4a; padding: 20px; margin-bottom: 20px; border-radius: 4px; }
        textarea { width: 100%; height: 100px; background: rgba(5, 5, 5, 0.8); border: 1px solid #5a4a6a; color: #fff; padding: 10px; box-sizing: border-box; resize: none; }
        button { width: 100%; background: #3a1a5a; border: 1px solid #7a5a9a; color: #fff; padding: 15px; font-weight: bold; cursor: pointer; letter-spacing: 2px; }
        button:hover { background: #4a2a6a; }
        #rezilta { margin-top: 20px; padding: 15px; background: rgba(10, 30, 10, 0.5); border: 1px solid #2a5a2a; border-radius: 4px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>BNEI OHR</h2>
        <hr style="border-color: #3a2a4a;">
        <br>
        
        <div class="question-box">
            <p>Ki "Règ lò" yon elèv dwe itilize pou l konnen si yon lide k ap travèse lespri l soti nan ego l oswa nan gidans nanm li?</p>
            <textarea id="rep1" placeholder="Ekri repons ou la..."></textarea>
        </div>

        <div class="question-box">
            <p>Poukisa li nesesè pou nou fè silans nan kè a (Lev) anvan nou ka tande vwa Neshama a?</p>
            <textarea id="rep2" placeholder="Ekri repons ou la..."></textarea>
        </div>

        <button id="btnSoumet" onclick="soumetRepons()">SOUMÈT REPONS YO POU EVALYASYON</button>
        <div id="rezilta"></div>
    </div>

    <script>
        async function soumetRepons() {
            const r1 = document.getElementById('rep1').value;
            const r2 = document.getElementById('rep2').value;
            const btn = document.getElementById('btnSoumet');
            const rez = document.getElementById('rezilta');

            if(!r1 || !r2) { alert('Tanpri reponn tout kesyon yo.'); return; }

            btn.innerText = "Y AP EVALYE REPONS YO...";
            btn.disabled = true;
            rez.style.display = "none";

            try {
                const res = await fetch('https://akademi.bneiohr.workers.dev', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'gemini-1.5-flash',
                        max_tokens: 1000,
                        messages: [{ 
                            role: 'user', 
                            content: `Evalye repons sa yo pou Modil 1 Leson 1:\nKesyon 1: Ki Règ lò...\nRepons: ${r1}\n\nKesyon 2: Poukisa silans...\nRepons: ${r2}` 
                        }]
                    })
                });

                const data = await res.json();
                rez.innerHTML = data.choices ? data.choices[0].message.content : (data.candidates ? data.candidates[0].content.parts[0].text : "Repons anrejistre!");
                rez.style.display = "block";
            } catch (err) {
                alert("Gen yon ti pwoblèm ki rive: " + err.message);
            } finally {
                btn.innerText = "SOUMÈT REPONS YO POU EVALYASYON";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
