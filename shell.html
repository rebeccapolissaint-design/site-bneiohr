<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bnei Ohr — École Initiatique</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#07040d}

/* IFRAME — tout ekran sof player anba */
#content{
  position:fixed;
  top:0;left:0;right:0;
  bottom:68px;
  width:100%;border:none;
  background:#07040d;
}

/* ── PLAYER BAR ── */
#gp{
  position:fixed;bottom:0;left:0;right:0;height:68px;
  background:#08050e;
  border-top:1px solid rgba(212,175,55,.2);
  display:flex;align-items:center;
  padding:0 14px;gap:8px;
  z-index:9999;font-family:'Cinzel',serif;
}

/* barre progression en haut du player */
#gp-track{
  position:absolute;top:0;left:0;right:0;height:2px;
  background:rgba(212,175,55,.08);cursor:pointer;
}
#gp-fill{height:100%;width:0;background:linear-gradient(90deg,#a07828,#d4af37,#f0d060);pointer-events:none}

/* boutons prev/next */
.gp-skip{
  width:28px;height:28px;background:none;border:none;
  color:rgba(212,175,55,.4);cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:color .2s;padding:0;
}
.gp-skip:hover{color:#d4af37}
.gp-skip svg{width:14px;height:14px;fill:currentColor}

/* bouton play */
#gp-play{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  background:rgba(212,175,55,.08);
  border:1.5px solid rgba(212,175,55,.28);
  color:#d4af37;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .12s;
}
#gp-play:hover{background:rgba(212,175,55,.18);transform:scale(1.06)}
#gp-play svg{width:15px;height:15px;fill:#d4af37}

/* info */
#gp-info{flex:1;min-width:0;padding:0 6px;overflow:hidden}
#gp-name{font-size:.46rem;letter-spacing:.13em;color:#d4af37;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gp-time{font-family:'Cormorant Garamond',serif;font-size:.68rem;color:rgba(212,175,55,.3);margin-top:2px;letter-spacing:.04em}

/* iframe SoundCloud caché */
#sc{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;top:-999px;left:-999px}
</style>
</head>
<body>

<!-- IFRAME SITE PRINCIPAL -->
<iframe id="content" name="content" src="index.html"></iframe>

<!-- PLAYER GLOBAL -->
<div id="gp">
  <div id="gp-track"><div id="gp-fill"></div></div>

  <button class="gp-skip" id="btn-prev">
    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
  </button>

  <button id="gp-play">
    <svg id="ico-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="ico-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  </button>

  <button class="gp-skip" id="btn-next">
    <svg viewBox="0 0 24 24"><path d="M6 18 14.5 12 6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
  </button>

  <div id="gp-info">
    <div id="gp-name">Bnei Ohr — Mizik Sakre</div>
    <div id="gp-time">Klike ▶ pou koute</div>
  </div>

  <iframe id="sc" allow="autoplay" src=""></iframe>
</div>

<!-- SoundCloud API -->
<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
(function(){
  var PL = [
    {t:'Malkout nan Eklè',      u:'https://soundcloud.com/bnei-ohr/malkout-nan-ekl'},
    {t:'Bore Bore',              u:'https://soundcloud.com/bnei-ohr/bore-bore-2'},
    {t:'Poto Mitan',             u:'https://soundcloud.com/bnei-ohr/poto-mitan'},
    {t:'Pot Bnei Ohr',           u:'https://soundcloud.com/bnei-ohr/pot-bnei-ohr'},
    {t:'Mélodie Ocre Noire III', u:'https://soundcloud.com/bnei-ohr/melodie-ocre-noire-3'},
    {t:'Mélodie Ocre Noire IV',  u:'https://soundcloud.com/bnei-ohr/melodie-ocre-noire-4'}
  ];
  var idx=0, isPlaying=false, ready=false, w=null;

  var scFrame  = document.getElementById('sc');
  var btnPlay  = document.getElementById('gp-play');
  var icoPlay  = document.getElementById('ico-play');
  var icoPause = document.getElementById('ico-pause');
  var nameEl   = document.getElementById('gp-name');
  var timeEl   = document.getElementById('gp-time');
  var fill     = document.getElementById('gp-fill');
  var track    = document.getElementById('gp-track');

  function fmt(ms){
    if(!ms||isNaN(ms))return '0:00';
    var s=Math.floor(ms/1000),m=Math.floor(s/60);
    return m+':'+(('0'+(s%60)).slice(-2));
  }
  function icons(p){
    isPlaying=p;
    icoPlay.style.display=p?'none':'';
    icoPause.style.display=p?'':'none';
  }
  function setName(i){
    nameEl.textContent=PL[i].t;
    fill.style.width='0%';
    timeEl.textContent='';
  }

  // Init widget avec la première piste
  function initSC(){
    var enc=encodeURIComponent(PL[0].u);
    scFrame.src='https://w.soundcloud.com/player/?url='+enc
      +'&color=%23d4af37&auto_play=false&hide_related=true'
      +'&show_comments=false&show_user=false&buying=false&sharing=false';

    w=SC.Widget(scFrame);

    w.bind(SC.Widget.Events.READY,function(){
      ready=true;
      setName(0);
    });
    w.bind(SC.Widget.Events.PLAY, function(){ icons(true); });
    w.bind(SC.Widget.Events.PAUSE,function(){ icons(false); });
    w.bind(SC.Widget.Events.FINISH,function(){
      idx=(idx+1)%PL.length;
      loadPlay(idx,true);
    });
    w.bind(SC.Widget.Events.PLAY_PROGRESS,function(e){
      w.getDuration(function(dur){
        if(!dur)return;
        fill.style.width=((e.currentPosition/dur)*100)+'%';
        timeEl.textContent=fmt(e.currentPosition)+' / '+fmt(dur);
      });
    });
  }

  function loadPlay(i,autoplay){
    idx=i; setName(i);
    if(!ready)return;
    w.load(PL[i].u,{
      auto_play:!!autoplay,
      buying:false,sharing:false,download:false,
      show_artwork:false,show_comments:false,
      show_playcount:false,show_user:false
    });
    if(autoplay)icons(true);
  }

  // Boutons
  btnPlay.addEventListener('click',function(){
    if(!ready)return;
    isPlaying?w.pause():w.play();
  });
  document.getElementById('btn-prev').addEventListener('click',function(){
    loadPlay((idx-1+PL.length)%PL.length,isPlaying);
  });
  document.getElementById('btn-next').addEventListener('click',function(){
    loadPlay((idx+1)%PL.length,isPlaying);
  });
  track.addEventListener('click',function(e){
    if(!ready)return;
    var r=track.getBoundingClientRect();
    var p=(e.clientX-r.left)/r.width;
    w.getDuration(function(d){w.seekTo(Math.floor(p*d));});
  });

  // Expose pou paj yo itilize: parent.gpLoad(index)
  window.gpLoad=function(i){ loadPlay(i,true); };

  // Fix navigasyon nan iframe — fè tout lyen entèn chaje anndan #content
  var iframe=document.getElementById('content');
  function fixIframeLinks(){
    try{
      var doc=iframe.contentDocument||iframe.contentWindow.document;
      var links=doc.querySelectorAll('a[href]');
      links.forEach(function(a){
        var h=a.getAttribute('href')||'';
        if(!h||h.startsWith('#')||h.startsWith('mailto')||h.startsWith('javascript'))return;
        if(h.startsWith('http')&&h.indexOf('bneiohr')===-1)return;
        a.setAttribute('target','content');
      });
    }catch(e){}
  }
  iframe.addEventListener('load',function(){
    fixIframeLinks();
    // Re-check apre JS paj la fini
    setTimeout(fixIframeLinks,600);
    setTimeout(fixIframeLinks,1500);
  });

  initSC();
})();
</script>
</body>
</html>
